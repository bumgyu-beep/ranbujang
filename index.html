<style>

const hasQty=i=>typeof i.qty==='number';
const store={get(k,d){try{const v=localStorage.getItem('rk-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('rk-'+k,JSON.stringify(v))}catch(e){}}};
S.closed=store.get('closed',{});S.who=store.get('who','');S.counts={};S.drafts={};S.peers=[];S.project='';
{const t=store.get('tab','check');if(TABS.some(x=>x.id===t))S.tab=t}
if(TABS.some(t=>'#'+t.id===location.hash))S.tab=location.hash.slice(1);

let undoFn=null;
function toast(msg,undo){const t=$('#toast');undoFn=undo||null;
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" class="btn small" data-act="undo" style="background:transparent;color:inherit;border-color:currentColor">되돌리기</button>':''}`;
  t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true;undoFn=null},undo?7000:2600)}
const zoneLabel=z=>String(z||'기타').replace(/\(사무실\)$/,'');
const byOrder=(a,b)=>(a.order??0)-(b.order??0)||(a.name||'').localeCompare(b.name||'','ko');
function groups(list){const m=new Map();for(const i of list){const z=i.zone||'기타';if(!m.has(z))m.set(z,[]);m.get(z).push(i)}return [...m]}
const isOpen=k=>!S.closed[k];
function zoneHead(k,label,count,hot,z){const open=isOpen(k);const who=z?editorsIn(z):[];
  return `<button type="button" class="cat-h" data-fold="${esc(k)}" aria-expanded="${open}"><svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>${esc(label)}${who.length?`<span class="who">${who.map(w=>`<i>${esc(w)}</i>`).join('')}</span>`:''}<span class="cnt">${hot?`<span class="hot ${/^바뀜/.test(hot)?'chg':''}">${hot}</span>`:''}${count}개</span></button>`}
function foldAllBar(keys){if(keys.length<2)return '';const anyOpen=keys.some(isOpen);
  return `<button class="btn small ghost" data-foldall="${anyOpen?'close':'open'}" data-keys="${esc(JSON.stringify(keys))}">${anyOpen?'모두 접기':'모두 펼치기'}</button>`}
const inPlace=p=>S.items.filter(i=>i.place===p).sort(byOrder);
const zonesOf=list=>[...new Set(list.map(i=>i.zone||'기타'))];
const countOf=i=>S.counts[i.id]!=null?n(S.counts[i.id]):(hasQty(i)?i.qty:null);
const isShort=i=>i.min!=null&&hasQty(i)&&i.qty<i.min;

/* 비고에서 유통기한 읽기: 26.11.02 / 26년 8월 / 유통기한 2026년 */
function expiry(note){
  if(!note)return null;let m,d;
  if(m=note.match(/(\d{2})\.(\d{1,2})\.(\d{1,2})/))d=new Date(2000+ +m[1],m[2]-1,+m[3]);
  else if(m=note.match(/(\d{2})년\s*(\d{1,2})월/))d=new Date(2000+ +m[1],+m[2],0);
  else if(m=note.match(/유통기한\s*(\d{4})년/))d=new Date(+m[1],11,31);
  if(!d||isNaN(d))return null;
  const days=Math.floor((d-new Date())/864e5);
  return {d,days,state:days<0?'past':days<=60?'soon':'ok',label:`${String(d.getFullYear()).slice(2)}.${String(d.getMonth()+1).padStart(2,'0')}${m[3]?'.'+String(d.getDate()).padStart(2,'0'):''}`};
}
function expChip(note){const e=expiry(note);if(!e||e.state==='ok')return '';
  return `<span class="exp ${e.state}">${e.state==='past'?'기한 지남':'기한 임박'} ${e.label}</span>`}
const expAlerts=()=>S.items.filter(i=>{const e=expiry(i.note);return e&&e.state!=='ok'});

/* 사무실에서 같은 비품 찾기 */
const norm=s=>String(s||'').replace(/\(.*?\)/g,'').replace(/\s+/g,'').replace(/건전지/g,'배터리').replace(/숫가락/g,'숟가락').replace(/테이프$/,'').toLowerCase();
function sources(item){
  const a=norm(item.name);
  return inPlace(OFF).filter(o=>{const b=norm(o.name);return a&&b&&(a===b||(a.length>=2&&b.length>=2&&(a.includes(b)||b.includes(a))))})
    .sort((x,y)=>(norm(y.name)===a)-(norm(x.name)===a)||(y.qty||0)-(x.qty||0));
}

function fmtDate(iso){if(!iso)return'';const d=new Date(iso);return `${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
const yymmdd=d=>String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
function fmtFull(iso){const d=new Date(iso);return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

function renderStatus(){
  if(!S.ready){$('#status').innerHTML='';return}
  const sh=inPlace(VAN).filter(isShort).length,ex=expAlerts().length;
  const lc=S.checks[0]&&new Date(S.checks[0].at),days=lc?Math.floor((Date.now()-lc)/864e5):null;
  $('#status').innerHTML=`<div class="stats">
    <button class="stat ${sh?'alert':''}" data-tab="supply"><span class="v">${sh}</span><span class="k">보충 필요</span></button>
    <button class="stat ${ex?'alert':''}" data-tab="supply"><span class="v">${ex}</span><span class="k">유통기한 확인</span></button>
    <button class="stat" data-tab="hist"><span class="v">${lc?(days===0?'오늘':days+'<small>일 전</small>'):'–'}</span><span class="k">마지막 체크</span></button></div>`+
    (syncing?`<span class="syncpill">구글 시트와 맞추는 중…</span>`:SY.err&&mcp?`<span class="syncpill warn">시트 맞춤 실패 · 비품 목록 탭에서 확인</span>`:'');
}
function renderTabs(){
  const sh=inPlace(VAN).filter(isShort).length;
  $('#tabs').innerHTML=TABS.map(t=>`<button type="button" data-tab="${t.id}" ${S.tab===t.id?'aria-current="page"':''}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg>
    ${t.label}${t.id==='supply'&&sh?`<span class="badge">${sh}</span>`:''}${t.id==='check'&&S.tab!=='check'&&unsaved()?`<span class="badge navy">${unsaved()}</span>`:''}</button>`).join('');
}
const emptyGear=()=>`<div class="empty"><b>아직 등록된 비품이 없어요</b>비품 목록 탭에서 구글 시트 내용을 복사해 붙여넣으면 한 번에 등록돼요.<div style="margin-top:12px"><button class="btn primary" data-act="import">시트에서 붙여넣기</button></div></div>`;
const loading=()=>`<div class="empty"><b>비품 목록을 불러오는 중</b>잠시만요.</div>`;
function metaLine(i,extra){
  const bits=[];if(i.sub)bits.push(esc(i.sub));if(i.min!=null)bits.push(`최소 <span class="num">${i.min}</span>`);if(extra)bits.push(extra);
  const chip=expChip(i.note);
  return (bits.length||chip)?`<div class="meta">${bits.join(' · ')}${chip?(bits.length?' ':'')+chip:''}</div>`:'';
}

function vCheck(){
  if(!S.ready)return loading(); const all=inPlace(VAN); if(!all.length)return emptyGear();
  const list=all.filter(i=>S.zone==='전체'||(i.zone||'기타')===S.zone);
  let html=`<div class="fields">
    <label class="f">프로젝트명<input type="text" id="f-project" placeholder="프로젝트명" value="${esc(S.project)}"></label>
    <label class="f">체크한 사람<input type="text" id="f-who" placeholder="이름" value="${esc(S.who)}"></label></div>
    <div class="chips">${['전체',...zonesOf(all)].map(c=>`<button class="chip" data-zone="${esc(c)}" aria-pressed="${S.zone===c}">${esc(zoneLabel(c))}</button>`).join('')}</div>
    <div class="section-h"><h2>촬영 후 스타리아 수량</h2>${S.zone==='전체'?foldAllBar(groups(list).map(([z])=>'c:'+z)):''}</div>
    <p class="hint" style="margin:-4px 0 10px">지금 수량으로 채워져 있어요. 바뀐 것만 고치세요.</p>${saveCard()}<div class="zones under-save">`;
  for(const [z,gl] of groups(list)){
    const k='c:'+z,ch=gl.filter(i=>S.counts[i.id]!=null&&S.counts[i.id]!==i.qty).length;
    html+=`<section class="zone">`+zoneHead(k,zoneLabel(z),gl.length,ch?`바뀜 ${ch}`:'',z);if(S.zone==='전체'&&!isOpen(k)){html+='</section>';continue}
  for(const i of gl){
    const v=countOf(i),changed=hasQty(i)?v!==i.qty:v!=null,short=i.min!=null&&v!=null&&v<i.min;
    const d0=S.drafts[i.id],ed=editingItem(i.id);
    const diff=(changed&&hasQty(i)?`<span class="delta">${v-i.qty>0?'+':''}${v-i.qty}</span>`:'')+(d0&&d0.by&&d0.by!==S.who?` <span class="by">${esc(d0.by)}</span>`:'')+(ed?` <span class="by live">${esc(ed)} 입력 중</span>`:'');
    html+=`<div class="row ${short?'short':changed?'over changed':''}"><div style="min-width:0"><div class="name">${esc(i.name)}</div>${metaLine(i,diff)}</div>
      ${i.qtyText&&!hasQty(i)&&S.counts[i.id]==null?`<div style="display:flex;align-items:center"><span class="qtxt">${esc(i.qtyText)}</span><button class="btn small" data-step="0" data-id="${i.id}">숫자로</button></div>`:
      `<div class="stepper"><button type="button" data-step="-1" data-id="${i.id}" aria-label="${esc(i.name)} 하나 빼기">−</button>
      <input class="qin" type="number" inputmode="numeric" min="0" id="q-${i.id}" data-id="${i.id}" value="${v??''}" placeholder="–" aria-label="${esc(i.name)} 수량"><button type="button" data-step="1" data-id="${i.id}" aria-label="${esc(i.name)} 하나 더하기">+</button></div>`}</div>`;
  }html+='</section>'}
  html+='</div>';
  return html;
}
const unsaved=()=>inPlace(VAN).filter(i=>S.counts[i.id]!=null&&S.counts[i.id]!==i.qty).length;
function saveCard(bottom){
  const changed=unsaved(),short=inPlace(VAN).filter(i=>{const v=countOf(i);return i.min!=null&&v!=null&&v<i.min}).length;
  return `<div class="savecard ${bottom?'bottom':''}"><div class="sum"><span><b class="num">${changed}</b> 바뀜</span><span class="${short?'bad':''}"><b class="num">${short}</b> 최소 미만</span></div>
    ${changed?`<button class="btn ghost small" data-act="reset">되돌리기</button>`:''}
    <button class="btn primary small" data-act="save-check" ${S.busy?'disabled':''}>${S.busy?'저장 중…':'체크 저장'}</button></div>`}

function vSupply(){
  if(!S.ready)return loading(); if(!S.items.length)return emptyGear();
  const sh=inPlace(VAN).filter(isShort).map(i=>({i,src:sources(i)}));
  sh.sort((a,b)=>(a.src[0]?zoneLabel(a.src[0].zone):'힣').localeCompare(b.src[0]?zoneLabel(b.src[0].zone):'힣','ko'));
  let html=`<div class="section-h"><h2>스타리아에 채울 것</h2><small>최소 재고보다 적은 비품</small></div>`;
  if(!sh.length)html+=`<div class="ok-box"><span class="dot"></span><div><b>모자란 비품이 없어요</b><div style="color:var(--muted);font-size:13px">최소 재고가 적힌 비품만 확인해요. 촬영 후 체크를 저장하면 여기서 사무실 위치까지 알려드려요.</div></div></div>`;
  for(const {i,src} of sh){
    const need=i.min-i.qty;
    html+=`<div class="card short"><div class="top"><div><div class="name">${esc(i.name)}</div><div class="meta">스타리아 ${esc(zoneLabel(i.zone))} · 지금 <span class="num">${i.qty}</span> / 최소 <span class="num">${i.min}</span></div></div><span class="meta" style="text-align:right">최소까지<br><span class="need">${need}</span></span></div>`;
    if(!src.length)html+=`<div class="src"><div class="where" style="color:var(--short)">사무실에 같은 비품이 없어요. 구매가 필요해요.</div></div>`;
    for(const o of src){const has=hasQty(o)?o.qty:0;
      html+=`<div class="src"><div class="where"><span class="tag">사무실</span><b>${esc(zoneLabel(o.zone))}</b>${o.sub?' · '+esc(o.sub):''} · ${esc(o.name)} <span class="num">${hasQty(o)?o.qty:esc(o.qtyText||'?')}</span>개</div>
        ${has<=0?`<span class="meta">사무실 재고 없음</span>`:`<button class="btn small navy" data-act="move" data-id="${i.id}" data-from="${o.id}">옮겨 싣기</button>`}</div>`}
    html+='</div>';
  }
  const ex=expAlerts().sort((a,b)=>expiry(a.note).d-expiry(b.note).d);
  if(ex.length){html+=`<div class="section-h"><h2>유통기한 확인</h2><small>지났거나 60일 안에 끝나는 것</small></div><div class="list">`;
    for(const i of ex)html+=`<div class="row"><div style="min-width:0"><div class="name">${esc(i.name)}</div><div class="meta">${esc(i.place)} · ${esc(zoneLabel(i.zone))} · <span class="num">${hasQty(i)?i.qty:esc(i.qtyText)}</span>개</div></div>${expChip(i.note)}</div>`;
    html+='</div>'}
  const buy=inPlace(OFF).filter(isShort);
  if(buy.length){html+=`<div class="section-h"><h2>사무실 재고 부족</h2><small>구매 목록</small></div><div class="list">`;
    for(const i of buy)html+=`<div class="row"><div style="min-width:0"><div class="name">${esc(i.name)}</div><div class="meta">${esc(zoneLabel(i.zone))} · 지금 <span class="num">${i.qty}</span> / 최소 <span class="num">${i.min}</span></div></div><span class="need">+${i.min-i.qty}</span></div>`;
    html+='</div>'}
  return html;
}

function vGear(){
  if(!S.ready)return loading();
  let html=`<div class="toolbar"><div class="seg">${[VAN,OFF].map(p=>`<button data-place="${p}" aria-pressed="${S.place===p}">${p}</button>`).join('')}</div><span class="sp"></span>
    <button class="btn small primary" data-act="new">추가</button><button class="btn small" data-act="import">시트 붙여넣기</button></div>`;
  if(!S.items.length)return html+emptyGear();
  html+=syncLine();
  const q=S.q.trim().toLowerCase();
  const list=inPlace(S.place).filter(i=>!q||[i.name,i.zone,i.sub,i.note].some(x=>(x||'').toLowerCase().includes(q)));
  if(S.minMode)html+=`<p class="hint" style="margin:0 0 10px">각 비품 오른쪽 칸에 최소재고를 적으세요. 비워두면 보충 알림을 받지 않아요. 적는 즉시 저장돼요.</p>`;
  html+=`<input class="search" type="text" id="f-q" placeholder="이름, 구역, 비고로 찾기" value="${esc(S.q)}">
    <div class="toolbar">${S.place===VAN?`<button class="btn small" data-act="pdf-now">스타리아 목록 PDF</button>`:''}<button class="btn small" data-act="csv">전체 CSV (구글 시트용)</button><button class="btn small ${S.minMode?'navy':''}" data-act="min-mode">${S.minMode?'최소재고 설정 끝':'최소재고 설정'}</button><span class="sp"></span>${q?'':foldAllBar(groups(list).map(([z])=>'g:'+S.place+':'+z))}</div><div class="zones">`;
  for(const [z,gl] of groups(list)){
    const k='g:'+S.place+':'+z,sh=gl.filter(isShort).length;
    html+=`<section class="zone">`+zoneHead(k,zoneLabel(z),gl.length,sh?`부족 ${sh}`:'');if(!q&&!isOpen(k)){html+='</section>';continue}
  for(const i of gl){
    html+=`<div class="row ${isShort(i)?'short':''}"><div style="min-width:0"><div class="name">${esc(i.name)} <span class="num" style="font-weight:600">${hasQty(i)?i.qty+(i.unit||''):esc(i.qtyText||'–')}</span></div>
      ${metaLine(i)}${i.note?`<div class="note">${esc(i.note)}</div>`:''}</div>
      ${S.minMode?`<label class="minin">최소<input type="number" inputmode="numeric" min="0" class="min-in" id="m-${i.id}" data-id="${i.id}" value="${i.min??''}" placeholder="없음"></label>`:`<button class="btn small" data-act="edit" data-id="${i.id}">수정</button>`}</div>`;
  }html+='</section>'}
  if(!list.length)html+=`<div class="empty">찾는 비품이 없어요.</div>`;
  return html+'</div>';
}

function vHist(){
  if(!S.ready)return loading();
  if(!S.checks.length)return `<div class="empty"><b>체크 기록이 없어요</b>촬영 후 체크를 저장하면 날짜·현장별로 그때 수량이 그대로 남아요. 무엇을 얼마나 썼는지도 볼 수 있어요.</div>`;
  return `<p class="hint" style="margin:0 0 10px">기록을 누르면 그날 스타리아 전체 수량과 쓴 양을 볼 수 있어요.</p>`+S.checks.map(c=>{
    const used=(c.snap||[]).filter(x=>x.before!=null&&x.after!=null&&x.after<x.before);
    return `<div class="hist" role="button" tabindex="0" data-act="hist-open" data-id="${c.id}" style="cursor:pointer"><div class="t">${esc(c.project||'촬영명 없음')}<span>${fmtDate(c.at)}</span></div>
    <div class="meta" style="font-size:13px;color:var(--muted)">${esc(c.who||'이름 없음')} · 쓴 비품 ${used.length}종 · 최소 미만 ${(c.short||[]).length}종</div>
    ${used.length?`<div class="note">${used.slice(0,6).map(x=>`${esc(x.name)} −${x.before-x.after}`).join(', ')}${used.length>6?` 외 ${used.length-6}종`:''}</div>`:''}</div>`}).join('');
}

function vSetup(){return `<div class="empty"><b>아직 설정 전이에요</b>index.html 맨 위의 파이어베이스 설정값을 채워야 열려요.</div>`}
function vLogin(){return `<form class="card" id="login-form" style="gap:14px;margin-top:4px"><div><div class="name" style="font-size:20px">팀 비밀번호를 입력하세요</div>
  <div class="meta" style="margin-top:4px">한 번 들어오면 이 기기에서는 다시 묻지 않아요.</div></div>
  <label class="f">이름<input type="text" id="lg-name" autocomplete="name" placeholder="이름" value="${esc(S.who)}" required></label>
  <label class="f">팀 비밀번호<input type="password" id="lg-pw" autocomplete="current-password" required></label>
  <button class="btn primary" type="submit" id="lg-go">들어가기</button></form>`}
function vNoDb(){return `<div class="empty" style="border-style:solid"><b>팀 비품 목록을 불러오지 못했어요</b>
  란부장은 claude.ai에 로그인한 상태에서만 팀 데이터가 열려요.

  <li>claude.ai에 로그인한 뒤 이 링크를 다시 여세요.</li>

function render(){
  renderStatus();renderTabs();
  const a=document.activeElement,f=a&&a.id,pos=f&&a.selectionStart;
  $('#main').innerHTML=S.needSetup?vSetup():S.needLogin?vLogin():S.noDb?vNoDb():{check:vCheck,supply:vSupply,gear:vGear,hist:vHist}[S.tab]();
  if(f){const el=document.getElementById(f);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}

/* ---------- 시트(팝업) ---------- */
function closeSheet(){$('#sheet-root').innerHTML=''}
function openEdit(id){
  const i=id?S.items.find(x=>x.id===id):{place:S.place,zone:'',sub:'',name:'',qty:1,qtyText:'',min:null,note:''};
  if(!i)return;

const findSame=r=>S.items.find(i=>i.place===r.place&&i.zone===r.zone&&i.name===r.name);
function parseImport(text){
  const out=[];let k=Date.now();
  for(const line of text.split(/\r?\n/)){
    const c=line.split('\t').map(s=>s.trim());
    while(c.length&&c[0]==='')c.shift();
    if(c[0]!==VAN&&c[0]!==OFF||!c[3])continue;
    const [place,zone,sub,name,q0,q1,mn,...rest]=c;const q=(q1||q0||'').trim();
    const m=q.match(/^(\d+)\s*(개|통|롤|ea)?$/);let note=rest.join(' ').trim();
    const mm=/^\d+$/.test(mn||'');if(mn&&!mm)note=(mn+' '+note).trim();
    out.push({place,zone:zone||'기타',sub:sub&&sub!==zone?sub:'',name,qty:m?+m[1]:null,qtyText:m?'':q,min:mm?+mn:null,note,order:k++});
  }
  return out;
}

async function exportPdf(title,sub,rows,fname){
  if(!window.jspdf)return toast('PDF 도구를 불러오지 못했어요. 새로고침해 주세요');
  toast('PDF 만드는 중…');
  try{await document.fonts.load('600 16px "IBM Plex Sans KR"');await document.fonts.load('400 16px "IBM Plex Sans KR"')}catch(e){}
  const F='"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const W=595,H=842,K=2.5,M=36,RH=20,X=[M,M+86,M+258,M+300,W-M-34];
  const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
  const pages=[];let ctx,y;
  const clip=(t,w)=>{t=String(t||'');if(ctx.measureText(t).width<=w)return t;while(t.length>1&&ctx.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
  const newPage=()=>{const cv=document.createElement('canvas');cv.width=W*K;cv.height=H*K;ctx=cv.getContext('2d');ctx.scale(K,K);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);pages.push(cv);y=M;
    if(pages.length===1){ctx.fillStyle='#E9B949';ctx.fillRect(M,y,50,15);ctx.fillStyle='#1A1F1C';ctx.font=`700 9px ${F}`;ctx.fillText('RANKO',M+8,y+11);
      ctx.font=`700 19px ${F}`;ctx.fillText(title,M,y+40);ctx.font=`400 10px ${F}`;ctx.fillStyle='#646C67';ctx.fillText(`${sub} · ${rows.length}개 품목`,M,y+57);
      ctx.fillStyle='#1A1F1C';ctx.fillText('인수 팀 / 담당자 : ______________________     반출일 : ________     반납일 : ________',M,y+78);y+=96}
    ctx.fillStyle='#1A1F1C';ctx.font=`600 9.5px ${F}`;['구역','이름','수량','비고','확인'].forEach((h,i)=>ctx.fillText(h,X[i],y+12));
    y+=18;ctx.strokeStyle='#1A1F1C';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(M,y);ctx.lineTo(W-M,y);ctx.stroke()};
  newPage();let last=null;
  for(const r of rows){
    if(y+RH>H-M-14){newPage();last=null}
    ctx.font=`400 10px ${F}`;
    if(r.zone!==last){ctx.fillStyle='#646C67';ctx.fillText(clip(zoneLabel(r.zone),X[1]-X[0]-6),X[0],y+14);last=r.zone}
    ctx.fillStyle='#1A1F1C';ctx.fillText(clip(r.name,X[2]-X[1]-8),X[1],y+14);
    ctx.font=`600 10px ${F}`;ctx.fillText(clip(r.qty,X[3]-X[2]-4),X[2],y+14);
    ctx.font=`400 9px ${F}`;ctx.fillStyle='#646C67';ctx.fillText(clip(r.note,X[4]-X[3]-8),X[3],y+14);
    ctx.strokeStyle='#9AA19C';ctx.lineWidth=.8;ctx.strokeRect(X[4]+6,y+4,11,11);
    y+=RH;ctx.strokeStyle='#E0E3DF';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(M,y);ctx.lineTo(W-M,y);ctx.stroke();
  }
  pages.forEach((cv,i)=>{const c=cv.getContext('2d');c.fillStyle='#9AA19C';c.font=`400 8px ${F}`;c.fillText(`란부장 · ${i+1}/${pages.length}`,M,H-20);
    if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',.9),'JPEG',0,0,W,H)});
  const ok=await saveFile(fname+'.pdf',pdf.output('blob'));
  if(!ok)showPages(pages.map(cv=>cv.toDataURL('image/jpeg',.9)),fname);
}

  const iq=i.qty||0,oq=o.qty;closeSheet();
  try{await db.collection('items').doc(o.id).update({qty:oq-take});await db.collection('items').doc(i.id).update({qty:iq+take});
    queueSync();toast(`${i.name} ${take}개 실었어요`,async()=>{try{await db.collection('items').doc(o.id).update({qty:oq});await db.collection('items').doc(i.id).update({qty:iq});toast('되돌렸어요')}catch(err){toast(errMsg(err))}})
  }catch(err){toast(errMsg(err))}
}

document.addEventListener('click',async e=>{
  const mv=e.target.closest('[data-mv]');if(mv){const el=$('#mv-qty');el.value=Math.max(1,Math.min(+el.max,n(el.value)+Number(mv.dataset.mv)));el.dispatchEvent(new Event('input',{bubbles:true}));return}
  const t=e.target.closest('[data-tab],[data-zone],[data-step],[data-place],[data-act],[data-fold],[data-foldall]');if(!t)return;
  if(t.dataset.fold){const k=t.dataset.fold;if(S.closed[k])delete S.closed[k];else S.closed[k]=1;store.set('closed',S.closed);render();return}
  if(t.dataset.foldall){const keys=JSON.parse(t.dataset.keys);for(const k of keys){if(t.dataset.foldall==='close')S.closed[k]=1;else delete S.closed[k]}store.set('closed',S.closed);render();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;store.set('tab',S.tab);render();window.scrollTo(0,0);return}
  if(t.dataset.zone){S.zone=t.dataset.zone;render();return}
  if(t.dataset.place){S.place=t.dataset.place;render();return}
  if(t.dataset.step!=null){const i=S.items.find(x=>x.id===t.dataset.id);if(!i)return;
    const cur=countOf(i)??0;setCount(i,Math.min(9999,Math.max(0,cur+Number(t.dataset.step))),0);render();return}
  const a=t.dataset.act;
  if(a==='close-bg'&&e.target!==t)return;
  if(a==='close'||a==='close-bg')return closeSheet();
  if(a==='save-check')return saveCheck();
  if(a==='reset'){if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='모두의 입력 지우기';t.classList.add('danger');setTimeout(()=>{if(t.isConnected){t.dataset.confirm='';t.textContent='되돌리기';t.classList.remove('danger')}},4000);return}
    await clearDrafts();render();return toast('모두의 입력을 지우고 지금 수량으로 되돌렸어요')}
  if(a==='move')return openMove(t.dataset.id,t.dataset.from);
  if(a==='move-yes')return refill(t.dataset.id,t.dataset.from,$('#mv-qty').value);
  if(a==='min-mode'){S.minMode=!S.minMode;render();return}
  if(a==='undo'){const f=undoFn;undoFn=null;$('#toast').hidden=true;if(f)f();return}
  if(a==='edit')return openEdit(t.dataset.id);
  if(a==='new')return openEdit(null);
  if(a==='import')return openImport();
  if(a==='do-import')return doImport();
  if(a==='hist-open')return openHist(t.dataset.id);
  if(a==='csv')return exportCsv();
  if(a==='sync')return pingSync(true);
  if(a==='pdf-now')return exportPdf('란코 스타리아 비품 목록',`${fmtFull(new Date().toISOString())} 기준 · 스타리아 804나 5560`,pdfRows(inPlace(VAN)),`[란코] 비품목록_${yymmdd(new Date())}`);
  if(a==='pdf-hist'){const c=S.checks.find(x=>x.id===t.dataset.id);if(!c)return;
    return exportPdf(`스타리아 비품 · ${c.project||'촬영명 없음'}`,`${fmtFull(c.at)} 체크 · ${c.who||''}`,(c.snap||[]).map(x=>({zone:x.zone,name:x.name,qty:x.after!=null?String(x.after):x.qtyText,note:x.note})),`[란코] 비품목록_${yymmdd(new Date(c.at))}${c.project?'_'+c.project.replace(/[\\/:*?"<>|]/g,'').trim():''}`)}
  if(a==='del'){
    if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='한 번 더 누르면 삭제';return}
    try{await db.collection('items').doc(t.dataset.id).delete();closeSheet();queueSync();toast('삭제했어요')}catch(err){toast(errMsg(err))}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='f-project'){S.project=e.target.value;S.projEditAt=Date.now();clearTimeout(S.projT);S.projT=setTimeout(()=>{if(db)db.collection('draftinfo').doc('current').set({project:S.project,by:S.who,at:new Date().toISOString()}).catch(()=>{})},500)}
  if(e.target.id==='f-who'){S.who=e.target.value;store.set('who',S.who);setPresence({})}
  if(e.target.id==='f-q'){S.q=e.target.value;render()}
  if(e.target.classList.contains('qin')&&e.target.dataset.id){const v=e.target.value.trim();
    const it=S.items.find(x=>x.id===e.target.dataset.id);if(it&&v!=='')setCount(it,Math.min(9999,n(v)),450)}
});
document.addEventListener('change',async e=>{
  if(e.target.classList.contains('qin')&&e.target.dataset.id){render();return}
  if(e.target.classList.contains('min-in')){const id=e.target.dataset.id,v=e.target.value.trim();if(!db)return;
    try{await db.collection('items').doc(id).update({min:v===''?null:n(v)});queueSync()}catch(err){toast(errMsg(err))}}
});
document.addEventListener('focusin',e=>{if(e.target.classList&&(e.target.classList.contains('qin')||e.target.classList.contains('min-in')))setTimeout(()=>{try{e.target.select()}catch(x){}},0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.act==='hist-open')openHist(e.target.dataset.id)});

document.addEventListener('submit',async e=>{
  if(e.target.id!=='login-form')return;e.preventDefault();
  const name=$('#lg-name').value.trim(),pw=$('#lg-pw').value;const b=$('#lg-go');b.disabled=true;b.textContent='확인 중…';
  try{await F.setDoc(F.doc(fs,'members',uid),{pw,name,at:new Date().toISOString()});S.who=name;store.set('who',name);S.needLogin=false;start()}
  catch(err){b.disabled=false;b.textContent='들어가기';toast(err&&err.code==='permission-denied'?'비밀번호가 맞지 않아요':'들어가지 못했어요. 인터넷 연결을 확인하세요')}
});

/* ---------- Firestore를 기존 코드가 쓰던 모양으로 감싸기 ---------- */
const wrapDoc=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
function docApi(ref){return{id:ref.id,
  get:async()=>wrapDoc(await F.getDoc(ref)),set:d=>F.setDoc(ref,d),update:d=>F.updateDoc(ref,d),delete:()=>F.deleteDoc(ref),
  onSnapshot:(n,e)=>F.onSnapshot(ref,s=>n(wrapDoc(s)),e)}}
function colApi(path,q){q=q||[];return{
  doc:id=>docApi(id?F.doc(fs,path,id):F.doc(F.collection(fs,path))),
  add:d=>F.addDoc(F.collection(fs,path),d),
  orderBy:(f,d)=>colApi(path,[...q,F.orderBy(f,d)]),limit:k=>colApi(path,[...q,F.limit(k)]),
  onSnapshot:(n,e)=>F.onSnapshot(F.query(F.collection(fs,path),...q),s=>n({docs:s.docs.map(wrapDoc)}),e)}}

let fs=null,uid=null,started=false;
function start(){
  if(started)return;started=true;
  db={collection:p=>colApi(p)};
  $('#conn').textContent='팀 실시간 공유';
  db.collection('items').onSnapshot(s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()}));S.ready=true;render()},
    ()=>{$('#conn').textContent='연결이 끊겼어요. 새로고침하세요'});
  db.collection('draft').onSnapshot(snap=>{applyDrafts(snap.docs);if(S.tab==='check'&&!(document.activeElement&&document.activeElement.classList.contains('qin')))render();else{renderStatus();renderTabs()}},()=>{});
  db.collection('draftinfo').doc('current').onSnapshot(d=>{const p=d.exists?(d.data().project||''):'';if(Date.now()-(S.projEditAt||0)>3000&&p!==S.project){S.project=p;if(S.tab==='check')render()}},()=>{});
  db.collection('presence').onSnapshot(s=>{S.peers=s.docs.map(d=>{const x=d.data();return{isMe:d.id===uid,presence:x,at:x.at||0}});
    const c=$('#conn');if(c)c.textContent=peerLine()||'팀 실시간 공유';
    if(S.tab==='check'&&!(document.activeElement&&document.activeElement.classList.contains('qin')))render()},()=>{});
  setPresence({});
  setInterval(()=>{if(document.visibilityState==='visible')setPresence({})},45000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setPresence({})});
  db.collection('sync').doc('state').onSnapshot(d=>{SY.state=d.exists?d.data():null;if(S.tab==='gear')render()},()=>{});
  db.collection('checks').orderBy('at','desc').limit(60).onSnapshot(s=>{S.checks=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
}

render();
if(!FIREBASE_CONFIG.apiKey){S.needSetup=true;S.ready=true;render()}
else{
  const app=initializeApp(FIREBASE_CONFIG);const auth=A.getAuth(app);fs=F.getFirestore(app);
  A.onAuthStateChanged(auth,async u=>{
    if(!u){A.signInAnonymously(auth).catch(()=>{$('#conn').textContent='연결 실패';toast('접속하지 못했어요. 새로고침하세요')});return}
    uid=u.uid;
    let m=null;try{m=await F.getDoc(F.doc(fs,'members',uid))}catch(e){}
    if(m&&m.exists()){const nm=m.data().name;if(!S.who&&nm){S.who=nm;store.set('who',nm)}start()}
    else{S.needLogin=true;S.ready=true;$('#conn').textContent='로그인 필요';render()}
  });
}
})();
</script>
